<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simracing Telemetry</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Simracing Telemetry</h1>
  </header>

  <main>
    <section id="device-mapping" class="section">
      <h2>Device mapping</h2>
      <p id="gamepad-hint" class="hint">Click anywhere on the page to detect gamepads (required in some browsers).</p>
      <div id="gamepad-list" class="gamepad-list"></div>
      <div class="mapping-controls">
        <div class="mapping-row">
          <label for="steering-select">Steering</label>
          <select id="steering-select" class="mapping-select">
            <option value="">None</option>
          </select>
        </div>
        <div class="mapping-row">
          <label for="brake-select">Brake</label>
          <select id="brake-select" class="mapping-select">
            <option value="">None</option>
          </select>
        </div>
        <div class="mapping-row">
          <label for="throttle-select">Throttle</label>
          <select id="throttle-select" class="mapping-select">
            <option value="">None</option>
          </select>
        </div>
      </div>
    </section>

    <section id="settings" class="section">
      <h2>Settings</h2>
      <div class="settings-row">
        <label for="seconds-per-1080">Seconds per 1080px</label>
        <input type="number" id="seconds-per-1080" value="10" min="1" max="120" step="1">
      </div>
      <div class="settings-row">
        <label for="graph-width">Graph width (px)</label>
        <input type="number" id="graph-width" value="1080" min="320" max="1920" step="1">
      </div>
    </section>

    <section id="telemetry" class="section">
      <h2>Telemetry</h2>
      <div class="telemetry-graphs">
        <div class="graph-container">
          <h3>Steering (-1080° to 1080°)</h3>
          <canvas id="steering-canvas" width="1080" height="250"></canvas>
        </div>
        <div class="graph-container">
          <h3>Braking (0–100%)</h3>
          <canvas id="brake-canvas" width="1080" height="250"></canvas>
        </div>
        <div class="graph-container">
          <h3>Acceleration (0–100%)</h3>
          <canvas id="throttle-canvas" width="1080" height="250"></canvas>
        </div>
      </div>
    </section>
  </main>

  <script src="telemetry.js"></script>
  <script src="app.js"></script>
</body>
</html>
